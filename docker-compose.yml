version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_scheduler_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: job_scheduler_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: job_scheduler_api
    environment:
      DATABASE_URL: "postgresql://admin:password@db:5432/scheduler?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      JWT_SECRET: "supersecret_jwt_key_for_assignment_only"
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: job_scheduler_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
